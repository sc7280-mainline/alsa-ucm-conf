# Use case configuration for Fairphone 5
# Author: Luca Weiss <luca.weiss@fairphone.com>

Syntax 4

LibraryConfig.remap.Config {
	ctl.default.map."name='Amplifier Playback Volume'" {
		"name='Amplifier L PCM Playback Volume'".vindex.0 0
		"name='Amplifier R PCM Playback Volume'".vindex.1 0
	}
}

SectionUseCase."HiFi" {
	File "/Fairphone/fp5/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/Fairphone/fp5/VoiceCall.conf"
	Comment "Phone call quality."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
