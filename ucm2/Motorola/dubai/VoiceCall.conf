# Use case configuration for Motorola Edge 30
# Author: Val Packett <val@packett.cool>

SectionVerb {
	EnableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='SEN_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='SEN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value.TQ "Voice"
}

SectionDevice."Earpiece" {
	Comment "Earpiece Playback"

	ConflictingDevice ["Mic1"]

	EnableSequence [
		# Mute the R/bottom speaker
		cset "name='Amplifier R Playback Switch' off"
		cset "name='Amplifier L Profile Set' Receiver"

		exec "dummystreamhack-wrapper Rhw:${CardId},5 start"
	]

	DisableSequence [
		exec "dummystreamhack-wrapper Rhw:${CardId},5 stop"

		cset "name='Amplifier L Profile Set' Music"
		cset "name='Amplifier R Playback Switch' on"
	]

	Value {
		PlaybackChannels 1
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackVolume "Amplifier L PCM Playback Volume"
	}
}

SectionDevice."Speaker" {
	Comment "Mono Speaker"

	ConflictingDevice ["Mic2"]

	EnableSequence [
		# Mute the L/top earpiece
		cset "name='Amplifier L Playback Switch' off"
		cset "name='Amplifier R Profile Set' Music"

		exec "dummystreamhack-wrapper Rhw:${CardId},5 start"
	]

	DisableSequence [
		exec "dummystreamhack-wrapper Rhw:${CardId},5 stop"

		cset "name='Amplifier R Profile Set' Music"
		cset "name='Amplifier L Playback Switch' on"
	]

	Value {
		PlaybackChannels 1
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackVolume "Amplifier R PCM Playback Volume"
	}
}


SectionDevice."Mic1" {
	Comment "Top Microphone Call"

	ConflictingDevice ["Earpiece"]

	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"

		exec "dummystreamhack-wrapper Thw:${CardId},5 start"
	]

	DisableSequence [
		exec "dummystreamhack-wrapper Thw:${CardId},5 stop"

		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 150
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
		CaptureSwitch "ADC1_MIXER"
	}
}

SectionDevice."Mic2" {
	Comment "Bottom Microphone Call"

	ConflictingDevice ["Speaker"]

	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic4EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP3"

		exec "dummystreamhack-wrapper Thw:${CardId},5 start"
	]

	DisableSequence [
		exec "dummystreamhack-wrapper Thw:${CardId},5 stop"

		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		CaptureSwitch "ADC2_MIXER"
	}
}
